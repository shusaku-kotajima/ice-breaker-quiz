<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI & Claude Code クイズ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#f5f4f0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem}
.card{background:#fff;border-radius:16px;padding:1.75rem;width:100%;max-width:560px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.screen{display:none}.screen.active{display:block}

#menu-screen{text-align:center;padding:1rem 0}
.menu-title{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#1a1a1a;margin-bottom:0.25rem}
.menu-sub{font-size:13px;color:#888;margin-bottom:2rem}
.menu-btns{display:flex;flex-direction:column;gap:12px;max-width:300px;margin:0 auto}
.menu-btn{padding:16px;border-radius:12px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;font-size:15px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:background .15s}
.menu-btn:hover{background:#f5f4f0}
.menu-btn.primary{background:#534AB7;color:#fff;border-color:#534AB7}
.menu-btn.primary:hover{background:#3C3489}

#join-screen{text-align:center}
.join-title{font-size:22px;font-weight:700;margin-bottom:.5rem;color:#1a1a1a}
.join-sub{font-size:13px;color:#888;margin-bottom:1.5rem}
.name-input{width:100%;padding:14px;border-radius:10px;border:1px solid #ddd;font-size:16px;margin-bottom:12px;outline:none;font-family:'Noto Sans JP',sans-serif;color:#1a1a1a}
.name-input:focus{border-color:#534AB7}
.join-btn{width:100%;padding:14px;border-radius:10px;background:#534AB7;color:#fff;border:none;font-size:15px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif}
.join-btn:hover{background:#3C3489}
.back-link{margin-top:1rem;display:block;font-size:13px;color:#888;cursor:pointer;background:none;border:none;font-family:'Noto Sans JP',sans-serif}

#waiting-screen{text-align:center;padding:2rem 0}
.wait-icon{font-size:36px;margin-bottom:1rem;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.wait-title{font-size:18px;font-weight:500;color:#1a1a1a;margin-bottom:.5rem}
.wait-sub{font-size:13px;color:#888}
.p-badge{display:inline-block;margin-top:1rem;padding:6px 16px;background:#EEEDFE;color:#3C3489;border-radius:20px;font-size:13px;font-weight:500}

.ans-q-num{font-size:12px;color:#888;margin-bottom:.5rem}
.ans-q-text{font-size:16px;font-weight:500;color:#1a1a1a;margin-bottom:1.25rem;line-height:1.6}
.ans-options{display:flex;flex-direction:column;gap:10px}
.ans-opt{padding:16px;border-radius:12px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;text-align:left;font-family:'Noto Sans JP',sans-serif;width:100%;transition:all .15s;line-height:1.5}
.ans-opt:hover:not(:disabled){background:#EEEDFE;border-color:#534AB7}
.ans-opt.selected{background:#534AB7;color:#fff;border-color:#534AB7}
.ans-opt.correct{background:#EAF3DE;border-color:#639922;color:#27500A}
.ans-opt.wrong{background:#FCEBEB;border-color:#A32D2D;color:#501313}
.answered-msg{text-align:center;padding:1.25rem;color:#888;font-size:14px;display:none}
.ans-explanation{margin-top:1rem;padding:12px 14px;border-radius:10px;background:#f5f4f0;font-size:13px;color:#555;line-height:1.6;display:none}
.ans-explanation .exp-label{font-size:11px;font-weight:700;color:#534AB7;margin-bottom:4px;display:block}

#p-result-screen{text-align:center;padding:1rem 0}
.p-score-big{font-size:56px;font-weight:700;color:#534AB7}
.p-score-label{font-size:14px;color:#888;margin-bottom:1rem}
.p-result-msg{font-size:18px;font-weight:500;color:#1a1a1a}

.host-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.host-title{font-size:13px;font-weight:500;color:#888}
.host-progress{height:3px;background:#f0f0f0;border-radius:2px;margin-bottom:1.25rem}
.host-progress-fill{height:100%;border-radius:2px;background:#534AB7;transition:width .4s}
.host-q-tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;margin-bottom:.6rem;font-weight:500}
.tag-ai{background:#EEEDFE;color:#3C3489}
.tag-claude{background:#E1F5EE;color:#085041}
.tag-term{background:#FFF0DB;color:#7A4100}
.tag-advanced{background:#FDECEA;color:#7A1010}
.host-q-text{font-size:16px;font-weight:500;color:#1a1a1a;line-height:1.6;margin-bottom:1.25rem}
.host-chart{display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem}
.chart-row{display:flex;align-items:center;gap:8px}
.chart-label{font-size:12px;color:#666;width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-bar-wrap{flex:1;height:26px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.chart-bar{height:100%;border-radius:4px;transition:width .5s;background:#B5D4F4}
.chart-bar.is-answer{background:#639922}
.chart-bar.wrong-bar{background:#F09595}
.chart-count{font-size:12px;color:#888;width:24px;text-align:right}
.host-stats{display:flex;gap:10px;margin-bottom:1.25rem}
.stat-card{flex:1;background:#f5f4f0;border-radius:10px;padding:10px;text-align:center}
.stat-num{font-size:22px;font-weight:500;color:#1a1a1a}
.stat-label{font-size:11px;color:#888;margin-top:2px}
.host-btns{display:flex;gap:8px;flex-wrap:wrap}
.h-btn{flex:1;min-width:80px;padding:11px 8px;border-radius:10px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;font-size:13px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:background .15s}
.h-btn:hover:not(:disabled){background:#f5f4f0}
.h-btn:disabled{opacity:.3;cursor:default}
.h-btn.primary{background:#534AB7;color:#fff;border-color:#534AB7}
.h-btn.primary:hover:not(:disabled){background:#3C3489}
.host-explanation{margin-top:1rem;padding:12px;border-radius:10px;background:#f5f4f0;font-size:13px;color:#555;line-height:1.6;display:none}
.participants-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem;min-height:28px}
.p-pill{font-size:12px;padding:4px 10px;background:#EEEDFE;color:#3C3489;border-radius:20px}
.p-pill.answered{background:#EAF3DE;color:#27500A}

#host-result-screen{text-align:center}
.hr-title{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:1.5rem}
.ranking{display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:1.5rem}
.rank-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#f5f4f0;border-radius:10px}
.rank-num{font-size:18px;font-weight:700;width:28px}
.rank-name{flex:1;font-size:15px;font-weight:500;color:#1a1a1a}
.rank-score{font-size:13px;color:#888}

.config-banner{background:#FFF8E1;border:1px solid #F9A825;border-radius:10px;padding:12px 16px;font-size:13px;color:#5D4037;margin-bottom:1.5rem;line-height:1.6}
.config-banner code{background:#FFE082;padding:2px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="card">

<div id="menu-screen" class="screen active">
  <div id="config-warning" class="config-banner" style="display:none">
    ⚠️ Supabaseの設定がまだです。HTMLファイルの先頭にある<br>
    <code>SUPABASE_URL</code> と <code>SUPABASE_ANON_KEY</code> を書き換えてください。
  </div>
  <div class="menu-title">AI & Claude Code クイズ</div>
  <div class="menu-sub">用語5問 + 実践5問 + 上級5問 = 全15問</div>
  <div class="menu-btns">
    <button class="menu-btn primary" onclick="showScreen('join-screen')">参加者として参加する</button>
    <button class="menu-btn" onclick="startHost()">ホスト（進行役）として始める</button>
  </div>
</div>

<div id="join-screen" class="screen">
  <div class="join-title">参加する</div>
  <div class="join-sub">名前を入力してください</div>
  <input class="name-input" id="name-input" type="text" placeholder="例：田中" maxlength="12">
  <button class="join-btn" onclick="joinQuiz()">参加する</button>
  <button class="back-link" onclick="showScreen('menu-screen')">← 戻る</button>
</div>

<div id="waiting-screen" class="screen">
  <span class="wait-icon">⏳</span>
  <div class="wait-title">ホストの開始を待っています</div>
  <div class="wait-sub">ホストが問題を開くまでお待ちください</div>
  <div id="my-badge" class="p-badge"></div>
</div>

<div id="answer-screen" class="screen">
  <div class="ans-q-num" id="ans-q-num"></div>
  <div class="ans-q-text" id="ans-q-text"></div>
  <div class="ans-options" id="ans-options"></div>
  <div class="answered-msg" id="answered-msg">回答済み！ホストの正解発表をお待ちください ✅</div>
  <div class="ans-explanation" id="ans-explanation">
    <span class="exp-label">解説</span>
    <span id="ans-explanation-text"></span>
  </div>
</div>

<div id="p-result-screen" class="screen">
  <div class="p-score-big" id="p-score-big">0</div>
  <div class="p-score-label">/ 10 問正解</div>
  <div class="p-result-msg" id="p-result-msg"></div>
</div>

<div id="host-screen" class="screen">
  <div class="host-header">
    <span class="host-title">ホスト画面</span>
    <span id="host-q-num" style="font-size:13px;color:#888">Q1 / 10</span>
  </div>
  <div class="host-progress"><div class="host-progress-fill" id="host-progress-fill" style="width:0%"></div></div>
  <div class="participants-list" id="host-participants"></div>
  <span class="host-q-tag" id="host-tag"></span>
  <div class="host-q-text" id="host-q-text"></div>
  <div class="host-chart" id="host-chart"></div>
  <div class="host-stats">
    <div class="stat-card"><div class="stat-num" id="stat-answered">0</div><div class="stat-label">回答済み</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">参加者</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-correct-pct">—</div><div class="stat-label">正解率</div></div>
  </div>
  <div class="host-explanation" id="host-explanation"></div>
  <div class="host-btns">
    <button class="h-btn primary" id="btn-open" onclick="hostOpenAnswer()">回答を受付開始</button>
    <button class="h-btn" id="btn-reveal" onclick="hostReveal()" disabled>正解を発表</button>
    <button class="h-btn" id="btn-next" onclick="hostNext()" disabled>次の問題 →</button>
  </div>
</div>

<div id="host-result-screen" class="screen">
  <div class="hr-title">最終結果 🎉</div>
  <div class="ranking" id="ranking"></div>
  <button class="h-btn" style="width:100%" onclick="resetAll()">最初からやり直す</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ============================================================
// ★ ここを書き換えてください ★
const SUPABASE_URL = 'https://qhalhabbkrowwavenvhy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_yf5jxa6TaJ3SLyVxJ5feRw_ZsD04WtR';
// ============================================================

const QUESTIONS = [
  {
    tag:"term", tagLabel:"AI用語",
    q:"AIが文章を処理するときの最小単位。単語や文字の一部に分割されたもので、AIのコストや処理速度に直結する。これを何という？",
    options:["パラメータ","ウェイト","トークン","バッチ"],
    answer:2,
    explanation:"「トークン」が正解！「このモデルは128,000トークンまで処理できる」のように使われます。AIの料金もトークン数で計算されることが多いです。"
  },
  {
    tag:"term", tagLabel:"AI用語",
    q:"AIが一度に処理・記憶できる情報量の上限のこと。これを超えると古い情報から忘れていく。これを何という？",
    options:["コンテキストウィンドウ","トークンリミット","メモリバッファ","バッチサイズ"],
    answer:0,
    explanation:"「コンテキストウィンドウ」が正解！会話履歴やファイルの内容など、AIが「今見えている情報」の範囲のことです。長い会話で指示を忘れる原因もこれです。"
  },
  {
    tag:"term", tagLabel:"AI用語",
    q:"AIへの指示文・質問文のこと。書き方ひとつでAIの回答の質が大きく変わる。これを何という？",
    options:["スクリプト","コマンド","クエリ","プロンプト"],
    answer:3,
    explanation:"「プロンプト」が正解！「プロンプトエンジニアリング」という専門分野があるほど重要です。目的・条件・出力形式を具体的に書くほど精度が上がります。"
  },
  {
    tag:"term", tagLabel:"AI用語",
    q:"AIが事実ではない情報を、自信満々にもっともらしく出力してしまう現象のこと。存在しない論文や人物を作り出すことも。これを何という？",
    options:["バイアス","ハルシネーション","ドリフト","オーバーフィッティング"],
    answer:1,
    explanation:"「ハルシネーション（幻覚）」が正解！もっともらしく見えるため気づきにくいのが厄介です。重要な情報は必ず一次ソースで確認する習慣が大切です。"
  },
  {
    tag:"term", tagLabel:"AI用語",
    q:"AIエージェントが自律的にタスクをこなすために参照する、作業パターンや知識のまとまりのこと。CLAUDE.mdに記述して使う。これを何という？",
    options:["モジュール","ライブラリ","スキル","プラグイン"],
    answer:2,
    explanation:"「スキル」が正解！よく使う手順をスキルとして定義しておくと、毎回説明せずに再利用できます。チームで共有するとさらに効果的です。"
  },
  {
    tag:"ai", tagLabel:"AI実践",
    q:"ChatGPTやClaudeに長い文章を要約させたとき、重要な情報が抜け落ちる原因として最も可能性が高いのは？",
    options:["サーバーが混雑しているから","AIが日本語を正確に理解できていないから","入力がコンテキストウィンドウの上限に近く、後半が処理しきれていないから","要約プロンプトが敬語でないから"],
    answer:2,
    explanation:"コンテキストウィンドウの上限が原因のことが多いです。長文は前半を優先処理するため後半が薄くなりがち。「後半を中心に要約して」など範囲を指定するのが有効です。"
  },
  {
    tag:"ai", tagLabel:"AI実践",
    q:"AIに「AとBどちらがいいか？」と聞いたとき、毎回「どちらにも長所があります」と濁した回答が返ってくる。改善するプロンプトとして最も効果的なのは？",
    options:["質問を英語に翻訳して聞き直す","「あなたはXXの専門家です。AとBを比較し、XXの観点から必ずどちらか一方を推薦してください」と役割と条件を与える","「絶対に答えてください」と強く命令する","モデルを変える"],
    answer:1,
    explanation:"役割（ペルソナ）と制約（必ずどちらか選ぶ）を与えるのが効果的です。AIは曖昧な質問には曖昧に答えがち。条件を絞るほど具体的な回答が返ってきます。"
  },
  {
    tag:"ai", tagLabel:"AI実践",
    q:"AIが生成したコードをそのまま本番環境に使うリスクとして、最も見落とされやすいのは？",
    options:["コードが長すぎて読めない","AIが古いプログラミング言語しか知らない","コードに日本語コメントが入らない","セキュリティの考慮が不十分な場合がある（SQLインジェクション、認証漏れなど）"],
    answer:3,
    explanation:"AIは動くコードを生成しますが、セキュリティ面の考慮が抜けることがあります。入力バリデーション、認証・認可、SQLインジェクション対策などは必ず人間がレビューする必要があります。"
  },
  {
    tag:"claude", tagLabel:"Claude Code実践",
    q:"Claude Codeで作業中、突然「context length exceeded」というエラーが出た。どう対処するのが正しい？",
    options:["新しい会話を開始し、現在の状況とやりたいことを改めて整理して伝える","PCを再起動する","もっと短い質問を繰り返す","有料プランにアップグレードする"],
    answer:0,
    explanation:"コンテキスト上限に達したら新しい会話を始めるのが正解。その際「今〇〇を作っていて、ここまで完成している。次に△△を実装したい」と状況を整理して伝えると、スムーズに再開できます。"
  },
  {
    tag:"claude", tagLabel:"Claude Code実践",
    q:"Claude Codeに「このコードをリファクタリングして」と頼んだら、機能まで勝手に変更されてしまった。次回から防ぐには？",
    options:["コードをコメントアウトしてから渡す","英語で指示する","「機能は一切変えずに、コードの可読性だけ改善して。変更前後で動作が同じことを確認して」と制約を明示する","リファクタリングを頼むのをやめる"],
    answer:2,
    explanation:"AIへの指示は「やってほしいこと」だけでなく「やってはいけないこと」も明示するのが重要です。制約を言葉にして渡すことで意図しない変更を防げます。"
  },
  {
    tag:"claude", tagLabel:"Claude Code実践",
    q:"同じCLAUDE.mdを使っているのに、メンバーによってAIの出力品質に差が出る。最も根本的な原因として考えられるのは？",
    options:["AIがユーザーを記憶して対応を変えているから","ブラウザの種類が違うから","PCのスペックが違うから","CLAUDE.mdの内容は同じでも、各自がAIに渡す追加指示（プロンプト）の質や具体性に差があるから"],
    answer:3,
    explanation:"CLAUDE.mdは共通ベースを作るものですが、その場その場のプロンプト品質が出力を左右します。「目的・制約・出力形式」を揃えた社内プロンプトテンプレートを作るとさらに差が縮まります。"
  },
  {
    tag:"claude", tagLabel:"上級",
    q:"Claude Codeにユニットテストを生成させたところ、全ケースがパスした。しかしカバレッジツールで計測すると分岐の40%が未テストだった。最も適切な次のアクションは？",
    options:["カバレッジ100%を目標にすべてのテストをAIに追加させる","未カバーの分岐のパスと期待値を人間が特定し、そのケースに絞ったテスト追加をAIに依頼する","カバレッジが低いのはAIの限界なので手書きに切り替える","カバレッジ計測ツールの設定が間違っている"],
    answer:1,
    explanation:"カバレッジ100%追求はコストに見合わないことも多いです。重要なのは未カバーの分岐が何かを人間が理解し、リスクの高い箇所を優先してテストを追加すること。AIに丸投げせず「どこをテストすべきか」の判断は人間が持つべきです。"
  },
  {
    tag:"claude", tagLabel:"上級",
    q:"Claude Codeでマイクロサービス間のAPIを設計させた。生成されたOpenAPI仕様は整合性があり美しかった。しかし実装後に深刻な問題が発生した。最も考えられる原因は？",
    options:["OpenAPIのバージョンが古かった","AIが分散システム特有の問題（ネットワーク遅延・冪等性・サーキットブレーカー等）を設計に反映していなかった","マイクロサービスの数が多すぎた","AIはREST APIしか生成できない"],
    answer:1,
    explanation:"AIはAPIの形式的な正しさは得意ですが、冪等性（同じリクエストを複数回送っても安全か）、タイムアウト戦略、リトライ設計、サーキットブレーカーなどの分散システム固有の考慮は見落としがちです。非機能要件は人間が明示的に指示する必要があります。"
  },
  {
    tag:"claude", tagLabel:"上級",
    q:"大規模なレガシーコードベースをClaude Codeでリファクタリングしている。AIが提案する変更は個々には正しいが、適用後にシステム全体の挙動が変わってしまう。根本的な問題は何か？",
    options:["AIがレガシーコードを読めない","変更量が多すぎる","AIはコードの局所的な文脈は理解できるが、暗黙の依存関係・グローバルな状態・副作用の連鎖といったシステム全体のセマンティクスを把握しきれていない","テストが足りない"],
    answer:2,
    explanation:"AIのコンテキストウィンドウには限界があり、大規模コードベース全体を一度に理解できません。リファクタリング前に依存関係マップを人間が整理し、影響範囲を明示した上でAIに渡すことが重要です。また変更は小さく分割してリグレッションテストで都度確認する戦略が有効です。"
  },
  {
    tag:"claude", tagLabel:"上級",
    q:"Claude Codeを使ってコードを書いていたら、AIが提案したライブラリが実在するように見えるが、package.jsonに追加してnpm installしてもエラーになった。何が起きている？",
    options:["npmのサーバーが落ちている","AIがハルシネーションで存在しないライブラリ名を生成した（ファントムパッケージ）","パッケージ名の大文字小文字が違う","Node.jsのバージョンが古い"],
    answer:1,
    explanation:"「ファントムパッケージ」または「ゴーストライブラリ」と呼ばれる現象です。AIが実在しないパッケージ名をもっともらしく生成することがあります。必ずnpmjs.comで実在を確認してからインストールしてください。また悪意ある攻撃者が同名パッケージを公開する「タイポスクワッティング」にも注意が必要です。"
  },
  {
    tag:"claude", tagLabel:"上級",
    q:"Claude Codeに認証機能を実装させたところ、コードレビューでセキュリティチームから却下された。AIが見落としがちなセキュリティ上の問題として最も深刻なのはどれ？",
    options:["コメントが少ない","変数名が短い","JWTのsecretがハードコードされている、トークンの有効期限未設定、リフレッシュトークンの無効化機構がないなど、認証フローの設計レベルの欠陥","ログが出力されていない"],
    answer:2,
    explanation:"AIは動く認証コードを書けますが、JWTのsecretを環境変数で管理する、トークン失効の仕組み、ブルートフォース対策、セッション固定攻撃への対処など、セキュリティの深い考慮は抜けやすいです。認証・認可の実装は必ずセキュリティ専門家のレビューを通してください。"
  }
];

let sb, myName='', isHost=false, pollTimer=null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

window.addEventListener('DOMContentLoaded', ()=>{
  if(SUPABASE_URL.includes('your-project')){
    document.getElementById('config-warning').style.display='block';
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.channel('quiz_state_changes')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'quiz_state'},()=>tick())
    .subscribe();
});

async function getState(){
  const {data,error} = await sb.from('quiz_state').select('state,updated_at').eq('id','session').single();
  if(error||!data) return makeInit();
  return data.state;
}
async function setState(s){
  await sb.from('quiz_state').update({state:s,updated_at:new Date().toISOString()}).eq('id','session');
}
function makeInit(){
  return {phase:'waiting',currentQ:0,participants:{},answers:{}};
}

async function startHost(){
  isHost=true;
  const s=makeInit();
  await setState(s);
  showScreen('host-screen');
  renderHostQ(s);
  startPoll();
}

function renderHostQ(s){
  const q=QUESTIONS[s.currentQ];
  document.getElementById('host-progress-fill').style.width=(s.currentQ/QUESTIONS.length*100)+'%';
  document.getElementById('host-q-num').textContent=`Q${s.currentQ+1} / ${QUESTIONS.length}`;
  document.getElementById('host-tag').textContent=q.tagLabel;
  document.getElementById('host-tag').className='host-q-tag '+(q.tag==='ai'?'tag-ai':q.tag==='term'?'tag-term':q.tag==='claude'?'tag-claude':'tag-advanced');
  document.getElementById('host-q-text').textContent=q.q;
  document.getElementById('host-explanation').style.display='none';
  document.getElementById('host-explanation').textContent=q.explanation;
  renderChart(s,false);
  document.getElementById('btn-open').disabled=false;
  document.getElementById('btn-open').textContent='回答を受付開始';
  document.getElementById('btn-reveal').disabled=true;
  document.getElementById('btn-next').disabled=true;
}

function renderChart(s,revealed){
  const q=QUESTIONS[s.currentQ];
  const qk='q'+s.currentQ;
  const counts=q.options.map((_,i)=>Object.keys(s.answers||{}).filter(k=>k.startsWith(qk+'_')&&s.answers[k]===i).length);
  const total=counts.reduce((a,b)=>a+b,0)||1;
  document.getElementById('host-chart').innerHTML=q.options.map((opt,i)=>{
    const pct=Math.round(counts[i]/total*100);
    let bc='chart-bar';
    if(revealed) bc+=i===q.answer?' is-answer':' wrong-bar';
    return `<div class="chart-row"><div class="chart-label">${opt}</div><div class="chart-bar-wrap"><div class="${bc}" style="width:${counts[i]?pct:0}%"></div></div><div class="chart-count">${counts[i]}</div></div>`;
  }).join('');
}

function updateHostStats(s){
  const names=Object.keys(s.participants||{});
  const qk='q'+s.currentQ;
  const answered=Object.keys(s.answers||{}).filter(k=>k.startsWith(qk+'_'));
  const correct=answered.filter(k=>s.answers[k]===QUESTIONS[s.currentQ].answer).length;
  document.getElementById('stat-answered').textContent=answered.length;
  document.getElementById('stat-total').textContent=names.length;
  document.getElementById('stat-correct-pct').textContent=answered.length?Math.round(correct/answered.length*100)+'%':'—';
  const answeredNames=answered.map(k=>k.split('_')[1]);
  document.getElementById('host-participants').innerHTML=names.map(n=>`<span class="p-pill${answeredNames.includes(n)?' answered':''}">${n}${answeredNames.includes(n)?'✓':''}</span>`).join('');
}

async function hostOpenAnswer(){
  const s=await getState(); s.phase='open'; await setState(s);
  document.getElementById('btn-open').disabled=true;
  document.getElementById('btn-open').textContent='受付中...';
  document.getElementById('btn-reveal').disabled=false;
}
async function hostReveal(){
  const s=await getState(); s.phase='revealed'; await setState(s);
  renderChart(s,true);
  document.getElementById('host-explanation').style.display='block';
  document.getElementById('btn-reveal').disabled=true;
  document.getElementById('btn-next').disabled=false;
}
async function hostNext(){
  const s=await getState();
  if(s.currentQ+1>=QUESTIONS.length){
    s.phase='finished'; await setState(s);
    stopPoll(); showHostResult(s);
  } else {
    s.currentQ++; s.phase='waiting'; await setState(s);
    renderHostQ(s);
  }
}
function showHostResult(s){
  showScreen('host-result-screen');
  const names=Object.keys(s.participants||{});
  const scores=names.map(name=>{
    let sc=0;
    QUESTIONS.forEach((q,qi)=>{ if((s.answers||{})['q'+qi+'_'+name]===q.answer) sc++; });
    return {name,score:sc};
  }).sort((a,b)=>b.score-a.score);
  const medals=['🥇','🥈','🥉'];
  document.getElementById('ranking').innerHTML=scores.map((p,i)=>`<div class="rank-row"><div class="rank-num">${medals[i]||i+1}</div><div class="rank-name">${p.name}</div><div class="rank-score">${p.score} / ${QUESTIONS.length} 問正解</div></div>`).join('');
}
async function resetAll(){
  stopPoll(); myName=''; isHost=false;
  await setState(makeInit());
  showScreen('menu-screen');
}

async function joinQuiz(){
  const n=document.getElementById('name-input').value.trim();
  if(!n) return;
  myName=n;
  const s=await getState();
  if(!s.participants) s.participants={};
  s.participants[n]=true;
  await setState(s);
  document.getElementById('my-badge').textContent=n+' として参加中';
  showScreen('waiting-screen');
  startPoll();
}

function renderAnswerScreen(s){
  const q=QUESTIONS[s.currentQ];
  const qk='q'+s.currentQ+'_'+myName;
  const already=s.answers&&s.answers[qk]!==undefined;
  document.getElementById('ans-q-num').textContent=`Q${s.currentQ+1} / ${QUESTIONS.length}`;
  document.getElementById('ans-q-text').textContent=q.q;
  document.getElementById('ans-options').innerHTML=q.options.map((opt,i)=>
    `<button class="ans-opt${already&&s.answers[qk]===i?' selected':''}" onclick="submitAnswer(${i})" ${already?'disabled':''}>${opt}</button>`
  ).join('');
  document.getElementById('answered-msg').style.display=already?'block':'none';
  const expEl=document.getElementById('ans-explanation');
  if(expEl) expEl.style.display='none';
  showScreen('answer-screen');
}

async function submitAnswer(idx){
  const s=await getState();
  if(!s||s.phase!=='open') return;
  const qk='q'+s.currentQ+'_'+myName;
  if(!s.answers) s.answers={};
  if(s.answers[qk]!==undefined) return;
  s.answers[qk]=idx;
  await setState(s);
  document.querySelectorAll('.ans-opt').forEach((b,i)=>{b.disabled=true;if(i===idx)b.classList.add('selected');});
  document.getElementById('answered-msg').style.display='block';
}

function revealParticipant(s){
  const q=QUESTIONS[s.currentQ];
  const myAns=(s.answers||{})['q'+s.currentQ+'_'+myName];
  document.querySelectorAll('.ans-opt').forEach((b,i)=>{
    b.disabled=true; b.className='ans-opt';
    if(i===q.answer) b.classList.add('correct');
    else if(i===myAns) b.classList.add('wrong');
  });
  const expEl=document.getElementById('ans-explanation');
  const expText=document.getElementById('ans-explanation-text');
  if(expEl&&expText){ expText.textContent=q.explanation; expEl.style.display='block'; }
}

function showParticipantResult(s){
  stopPoll();
  let sc=0;
  QUESTIONS.forEach((q,qi)=>{ if((s.answers||{})['q'+qi+'_'+myName]===q.answer) sc++; });
  document.getElementById('p-score-big').textContent=sc;
  const msgs=['鍛錬あるのみ！また挑戦しよう','いい線いってます！','かなり実践的ですね！','完璧！現場のプロですね！'];
  document.getElementById('p-result-msg').textContent=sc>=9?msgs[3]:sc>=7?msgs[2]:sc>=5?msgs[1]:msgs[0];
  showScreen('p-result-screen');
}

function startPoll(){ stopPoll(); pollTimer=setInterval(tick,2500); }
function stopPoll(){ if(pollTimer) clearInterval(pollTimer); pollTimer=null; }

async function tick(){
  const s=await getState();
  const cur=document.querySelector('.screen.active')?.id;
  if(isHost){
    if(cur==='host-screen'){ renderChart(s,s.phase==='revealed'); updateHostStats(s); }
    return;
  }
  if(s.phase==='finished'){ showParticipantResult(s); return; }
  if(s.phase==='open'){
    if(cur==='waiting-screen'){ renderAnswerScreen(s); return; }
    if(cur==='answer-screen'){
      const shown=document.getElementById('ans-q-num').textContent;
      if(shown!==`Q${s.currentQ+1} / ${QUESTIONS.length}`){ renderAnswerScreen(s); return; }
      const alr=(s.answers||{})['q'+s.currentQ+'_'+myName]!==undefined;
      if(alr) document.getElementById('answered-msg').style.display='block';
    }
  }
  if(s.phase==='revealed'&&cur==='answer-screen') revealParticipant(s);
  if(s.phase==='waiting'&&cur==='answer-screen') showScreen('waiting-screen');
}
</script>
</body>
